name: flutter_session_recorder_example
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_session_recorder:
    path: ..
  # Keeps the screen on while running the perf harness so the device doesn't
  # auto-lock mid-scenario. Example-app only — not a dependency of the package.
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
